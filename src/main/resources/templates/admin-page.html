
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>AdminPage</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container my-2" align="right">
    <a th:href="@{/logout}"> Logout</a>
</div>

<div class="container my-2" align="center">
    <h3>Admin Page</h3>
    <a th:href="@{admin/addDoctor}" class="btn btn-primary btn-sm mb-3" >Add Doctor</a>
    <a th:href="@{admin/addSpecialty}" class="btn btn-primary btn-sm mb-3" >Add Specialty</a>
</div>

<div class="container my-2" align="center">

    <h3>Doctors List</h3>

    <div id="tnb-google-search-inner-container">
        <table style="width:80%" border="1"
               class = "table table-striped table-responsive-md">
            <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Specialities</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m:${map}">
                <td th:text="${m.getKey().firstName}"></td>
                <td th:text="${m.getKey().lastName}"></td>
                <td th:text="${m.getValue().specialtyName}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
