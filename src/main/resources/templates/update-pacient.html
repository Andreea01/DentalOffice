<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Update Pacient</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container my-2" align="center">
    <h1>Update Pacient</h1>
    <hr>

    <form action="#" th:action="@{/pacients/update}" th:object="${pacient}"
          method="POST">
        <input type="text" th:field="${pacient.cnp}"
               class="form-control mb-4 col-4">
        <input type="text" th:field="${pacient.firstName}"
               class="form-control mb-4 col-4">
        <input type="text" th:field="${pacient.lastName}"
               class="form-control mb-4 col-4">
        <input type="text" th:field="${pacient.phoneNumber}"
               class="form-control mb-4 col-4">
        <button type="submit" th:href="@{/pacients}" class="btn btn-info col-2">Update Pacient</button>
    </form>

    <hr>

    <a th:href="@{/pacients}"> Back to Pacients List</a>
</div>
</body>
</html>
