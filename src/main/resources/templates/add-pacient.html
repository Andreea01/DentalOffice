<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Add Pacient</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container my-2" align="center">
    <h1>Add Pacient</h1>
    <hr>

    <form action="#" th:action="@{/pacients/save}" th:object="${pacient}"
          method="POST">
        <input type="text" th:field="*{cnp}" placeholder="CNP"
               class="form-control mb-4 col-4">
        <input type="text" th:field="*{firstName}" placeholder="First Name"
               class="form-control mb-4 col-4">
        <input type="text" th:field="*{lastName}" placeholder="Last Name"
               class="form-control mb-4 col-4">
        <input type="text" th:field="*{phoneNumber}" placeholder="Phone Number"
               class="form-control mb-4 col-4">

        <button type="submit" th:href="@{/pacients}" class="btn btn-info col-2">Save
            Pacient</button>
    </form>

    <hr>

    <a th:href="@{/pacients}"> Back to Pacients List</a>
</div>
</body>
</html>
