<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Add Doctor</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container my-2" align="center">
    <h1>Add Doctor</h1>
    <hr>

    <form action="/admin/saveDoctor" th:action="@{/admin/saveDoctor}" th:object="${doctor}"
          method="POST">
            <input type="text" th:field="*{firstName}" placeholder="First Name"
                   class="form-control mb-4 col-4">
            <input type="text" th:field="*{lastName}" placeholder="Last Name"
                   class="form-control mb-4 col-4">
            <div  class="mb-4 col-4" >
                <label>Specialty:
                    <input class="block-list" type="checkbox" name="specialties"
                           th:each="specialty : ${specialtyList}"
                           th:text="${specialty.specialtyName}"
                           th:value="${specialty.id}"

                    />
                </label>

            </div>
        <div th:object="${newUser}">
            <input type="text" th:value="*{username}" placeholder="Username - email" name="username"
                   class="form-control mb-4 col-4">
            <input type="text" th:value="*{password}" placeholder="Password" name="password"
                   class="form-control mb-4 col-4">
        </div>
        <button type="submit" th:href="@{/admin}" class="btn btn-info col-2">Create Doctor Account</button>
    </form>
    <hr>

    <a th:href="@{/admin}"> Back to Admin Page</a>
</div>
</body>
</html>
