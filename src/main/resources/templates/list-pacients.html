
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Pacients</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container my-2" align="right">
    <a th:href="@{/logout}"> Logout</a>
</div>

<div class="container my-2" align="center">

    <h3>Pacients List</h3>
    <div id="tnb-google-search-inner-containear">
    <form th:action="@{pacients/search}" method="get"  class="mb-3">
        <input type="text" name="pacientCnp" th:value="${pacientCnp}"
               placeholder="Cnp" size="25" >
        <button type="submit" class="btn btn-primary btn-sm" >Search pacient</button>
    </form>
    <a th:href="@{pacients/add}" class="btn btn-primary btn-sm mb-3" >Add Pacient</a>
    </div>
    <div id="tnb-google-search-inner-container">
    <table style="width:80%" border="1"
           class = "table table-striped table-responsive-md">
        <thead>
        <tr>
            <th>CNP</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Phone Number</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pacient:${pacients}">
            <td th:text="${pacient.cnp}"></td>
            <td th:text="${pacient.firstName}"></td>
            <td th:text="${pacient.lastName}"></td>
            <td th:text="${pacient.phoneNumber}"></td>
            <td> <a th:href="@{/pacients/update/{cnpToBeUpdated}(cnpToBeUpdated=${pacient.cnp})}"
                    class="btn btn-primary">Update</a>
                <a th:href="@{/pacients/medicalRecords(recordsForCnp= ${pacient.cnp}, firstName= ${pacient.getFirstName()},
                lastName = ${pacient.getLastName()})}"
                   class="btn btn-primary">Medical Records</a>
                <a th:href="@{/pacients/delete/{cnpToBeDeleted}(cnpToBeDeleted=${pacient.cnp})}"
                   class="btn btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    </div>
</div>
</body>
</html>
